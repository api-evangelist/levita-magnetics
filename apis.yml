aid: levita-magnetics
name: Levita Magnetics
description: >-
  Levita Magnetics is a Mountain View, California medical device company, founded by minimally invasive
  surgeon Dr. Alberto Rodriguez-Navarro and co-founded by Nicolas Luksic, with an additional office in
  Santiago, Chile. It develops Magnetic Surgery — the Levita Magnetic Surgical System, in which an
  external magnet placed on the patient's skin controls a shaftless detachable retractor to enable
  reduced-port laparoscopic procedures — and the MARS (Magnetic-Assisted Robotic Surgery) platform
  launched in 2023, an FDA-cleared surgical robotic system used in abdominal and, more recently,
  pediatric procedures. The MARS platform is built on RTI Connext (the DDS real-time connectivity
  standard) internally, and Levita has demonstrated AI-guided autonomous camera control during surgery.
  Levita ships regulated surgical hardware and its embedded control software to hospitals; it operates
  no public developer program, publishes no API documentation, and exposes no machine-readable API
  contract on any host it controls.
